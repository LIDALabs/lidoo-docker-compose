services:
  odoo:
    restart: always             # run as a service
    image: odoo:17
    depends_on:
      - db
    ports:
      - "10017:8069"
      - "20017:8072"
    # tty: true
    # command: --
    environment:
      HOST: db
      USER: ${POSTGRES_USER:-odoo}
      PASSWORD: ${POSTGRES_PASSWORD:-supersecret}
    volumes:
      #- /etc/timezone:/etc/timezone:ro
      #- /etc/localtime:/etc/localtime:ro
      - ./entrypoint.sh:/entrypoint.sh   # if you want to install additional Python packages, uncomment this line!
      - ./config:/etc/odoo
      # - odoo-data:/var/lib/odoo
      - ./enterprise:/mnt/enterprise
      - ./l10n_ve:/mnt/l10n_ve_fiscal
      - ./addons:/mnt/extra_addons
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8069"]
      interval: 2s
      timeout: 10s
      retries: 30
    networks:
      - intranet
      - traefik-public

    labels:
      - traefik.enable=true
      #----------------------------------------------- routers for: odoo --------------------------------------------------
      # http
      - traefik.http.routers.odoo-http.rule=Host(`${ODOO_HOSTNAME}`)
      - traefik.http.routers.odoo-http.entrypoints=web
      - traefik.http.routers.odoo-http.middlewares=redirect@file
      - traefik.http.routers.odoo-http.service=odoo-service
      # https
      - traefik.http.routers.odoo-https.rule=Host(`${ODOO_HOSTNAME}`)
      - traefik.http.routers.odoo-https.entrypoints=websecure
      - traefik.http.routers.odoo-https.service=odoo-service
      - traefik.http.routers.odoo-https.tls.certresolver=letsencrypt
      - traefik.http.routers.odoo-https.middlewares=gzip,sslheader,limit
      #----------------------------- routes for: odoo/web/database || odoo/website/info  -----------------------------
      # http 
      - traefik.http.routers.odoo-db-http.rule=Host(`${ODOO_HOSTNAME}`) && (PathPrefix(`/web/database`) || PathPrefix(`/website/info`))
      - traefik.http.routers.odoo-db-http.entrypoints=web
      - traefik.http.routers.odoo-db-http.service=odoo-service
      - traefik.http.routers.odoo-db-http.middlewares=redirect@file
      - traefik.http.services.odoo-db-http.loadbalancer.server.port=8069
      # https 
      - traefik.http.routers.odoo-db-https.rule=Host(`${ODOO_HOSTNAME}`) && (PathPrefix(`/web/database`) || PathPrefix(`/website/info`))
      - traefik.http.routers.odoo-db-https.entrypoints=websecure
      - traefik.http.routers.odoo-db-https.service=odoo-service
      - traefik.http.routers.odoo-db-https.tls.certresolver=letsencrypt
      - traefik.http.routers.odoo-db-https.middlewares=gzip,sslheader,limit
      - traefik.http.services.odoo-db-https.loadbalancer.server.port=8069
      #---------------------------------------- routes for: odoo/longpolling ------------------------------------------------
      # http 
      - traefik.http.routers.odoo-im-http.rule=Host(`${ODOO_HOSTNAME}`) && (PathPrefix(`/longpolling`))
      - traefik.http.routers.odoo-im-http.entrypoints=web
      - traefik.http.routers.odoo-im-http.middlewares=redirect@file
      - traefik.http.routers.odoo-im-http.service=odoo-im-service
      # https 
      - traefik.http.routers.odoo-im-https.rule=Host(`${ODOO_HOSTNAME}`) && (PathPrefix(`/longpolling`))
      - traefik.http.routers.odoo-im-https.entrypoints=websecure
      - traefik.http.routers.odoo-im-https.service=odoo-im-service
      - traefik.http.routers.odoo-im-https.tls.certresolver=letsencrypt
      - traefik.http.routers.odoo-im-https.middlewares=gzip,sslheader,limit
      
      #====================================================== services ===========================================================
      - traefik.http.services.odoo-service.loadbalancer.server.port=8069
      - traefik.http.services.odoo-im-service.loadbalancer.server.port=8072

      #===================================================== middlewares =========================================================
      - traefik.http.middlewares.gzip.compress=true
      - traefik.http.middlewares.sslheader.headers.customrequestheaders.X-Forwarded-Proto=https
      - traefik.http.middlewares.limit.buffering.memRequestBodyBytes=20971520
      - traefik.http.middlewares.limit.buffering.maxRequestBodyBytes=20971520

  db:
    restart: always # run as a service
    image: postgres:17
    environment:
      POSTGRES_DB: postgres
      PGPASSWORD: '${POSTGRES_PASSWORD:-supersecret}'
      POSTGRES_USER: ${POSTGRES_USER:-odoo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-supersecret}
      PGDATA: '/var/lib/postgresql/data/pgdata'
    ports:
      - "5432:5432"
    volumes:
      - ./postgresql:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d postgres"]
      interval: 5s
      timeout: 20s
      retries: 10
    networks:
      - intranet

  # adminer:
  #   image: adminer
  #   networks:
  #     - intranet

  # mailpit:
  #   image: "axllent/mailpit:latest"
  #   ports:
  #     - "${FORWARD_MAILPIT_PORT:-1025}:1025"
  #     - "${FORWARD_MAILPIT_DASHBOARD_PORT:-8025}:8025"
  #   networks:
  #     - intranet

networks:
  intranet:
    driver: bridge
  traefik-public:
    external: true

