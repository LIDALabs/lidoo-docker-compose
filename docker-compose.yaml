services:
  # One Odoo process can serve multiple Postgres DBs (same container).
  # Default: single DB. Rare multi-DB-by-subdomain: set dbfilter in config/odoo.conf
  # (see comments there + README). No extra odoo service is required.
  odoo:
    restart: always
    build: .
    image: lidoo-odoo:18
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${ODOO_HTTP_PORT:-10018}:8069"
      - "${ODOO_GEVENT_PORT:-20018}:8072"
    environment:
      # Official entrypoint → Odoo db_host / db_user / db_password
      HOST: db
      USER: ${POSTGRES_USER:-odoo}
      PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      # Master password injected into runtime conf (see entrypoint below)
      ODOO_ADMIN_PASSWD: ${ODOO_ADMIN_PASSWD:?set ODOO_ADMIN_PASSWD in .env}
    # Odoo does not read admin_passwd from env; build a runtime conf then use the
    # official image entrypoint (wait-for-db + db CLI args).
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -euo pipefail
        : "$${ODOO_ADMIN_PASSWD:?ODOO_ADMIN_PASSWD must be set}"
        : "$${PASSWORD:?POSTGRES_PASSWORD must be set}"
        export ODOO_RC=/tmp/odoo.conf
        grep -v -E '^[[:space:]]*admin_passwd[[:space:]]*=' /etc/odoo/odoo.conf > "$$ODOO_RC"
        printf 'admin_passwd = %s\n' "$$ODOO_ADMIN_PASSWD" >> "$$ODOO_RC"
        exec /entrypoint.sh odoo
    volumes:
      # Mount only the conf file so /etc/odoo is not a host bind for sessions/logs
      - ./config/odoo.conf:/etc/odoo/odoo.conf:ro
      # Named volume for data_dir (sessions, filestore)
      - odoo_data:/var/lib/odoo
      - ./addons:/mnt/extra_addons
      - ./fonts:/usr/share/fonts/truetype/custom_fonts
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://127.0.0.1:8069/web/login" ]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 30s
    networks:
      - intranet
    # Traefik labels live only in docker-compose.traefik.yaml (optional overlay)

  # Single Postgres instance. Holds one or many Odoo databases (no second db service).
  # Host path ./database is legacy and unused; data lives in named volume db_data.
  db:
    restart: always
    image: postgres:17
    environment:
      POSTGRES_DB: postgres
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_USER: ${POSTGRES_USER:-odoo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      PGDATA: /var/lib/postgresql/data
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d postgres" ]
      interval: 5s
      timeout: 20s
      retries: 10
    networks:
      - intranet

  # Local-only DB UI (not exposed via Traefik / public interfaces)
  pgadmin:
    restart: always
    image: dpage/pgadmin4:latest
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:?set PGADMIN_DEFAULT_EMAIL in .env}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:?set PGADMIN_DEFAULT_PASSWORD in .env}
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      - "127.0.0.1:${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - intranet

volumes:
  odoo_data:
  db_data:
  pgadmin_data:

networks:
  intranet:
    driver: bridge
