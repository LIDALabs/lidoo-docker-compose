services:
  odoo:
    restart: always
    build: .
    image: lidoo-odoo:18
    depends_on:
      - db
    ports:
      - "10018:8069"
      - "20018:8072"
    environment:
      HOST: db
      USER: ${POSTGRES_USER:-odoo}
      PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      ODOO_ADMIN_PASSWD: ${ODOO_ADMIN_PASSWD:?set ODOO_ADMIN_PASSWD in .env}
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -euo pipefail
        : "$${ODOO_ADMIN_PASSWD:?ODOO_ADMIN_PASSWD must be set}"
        : "$${PASSWORD:?POSTGRES_PASSWORD must be set}"
        export ODOO_RC=/tmp/odoo.conf
        grep -v -E '^[[:space:]]*admin_passwd[[:space:]]*=' /etc/odoo/odoo.conf > "$$ODOO_RC"
        printf 'admin_passwd = %s\n' "$$ODOO_ADMIN_PASSWD" >> "$$ODOO_RC"
        exec /entrypoint.sh odoo
    volumes:
      #- /etc/timezone:/etc/timezone:ro
      #- /etc/localtime:/etc/localtime:ro
      - ./config/odoo.conf:/etc/odoo/odoo.conf:ro
      - odoo_data:/var/lib/odoo
      - ./addons:/mnt/extra_addons
      - ./fonts:/usr/share/fonts/truetype/custom_fonts
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://127.0.0.1:8069" ]
      interval: 2s
      timeout: 10s
      retries: 30
    networks:
      - intranet

  db:
    restart: always
    image: postgres:17
    environment:
      POSTGRES_DB: postgres
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_USER: ${POSTGRES_USER:-odoo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      PGDATA: /var/lib/postgresql/data
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d postgres" ]
      interval: 5s
      timeout: 20s
      retries: 10
    networks:
      - intranet

  pgadmin:
    restart: always
    image: dpage/pgadmin4:latest
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:?set PGADMIN_DEFAULT_EMAIL in .env}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:?set PGADMIN_DEFAULT_PASSWORD in .env}
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      - "127.0.0.1:${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - intranet

volumes:
  odoo_data:
  db_data:
  pgadmin_data:

networks:
  intranet:
    driver: bridge
