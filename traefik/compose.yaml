services:
  traefik:
    restart: always
    image: traefik:v3

    ports:
      - "${TRAEFIK_HTTP_PORT:-80}:80"
      - "${TRAEFIK_HTTPS_PORT:-443}:443"

    command:
      - --api.dashboard=true
      - --log=true
      - --log.level=${TRAEFIK_LOG_LEVEL:-INFO}

      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=traefik-public

      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443

      - --certificatesresolvers.letsencrypt.acme.httpchallenge=true
      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
      - --certificatesresolvers.letsencrypt.acme.email=${LETS_ENCRYPT_CONTACT_EMAIL:?set LETS_ENCRYPT_CONTACT_EMAIL in .env}
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json

    networks:
      - traefik-public

    volumes:
      - traefik_letsencrypt:/letsencrypt
      - /var/run/docker.sock:/var/run/docker.sock:ro

    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik-public

      # Dashboard: HTTP -> HTTPS
      - traefik.http.routers.traefik-http.rule=Host(`${TRAEFIK_HOSTNAME:?set TRAEFIK_HOSTNAME in .env}`)
      - traefik.http.routers.traefik-http.entrypoints=web
      - traefik.http.routers.traefik-http.service=api@internal
      - traefik.http.routers.traefik-http.middlewares=traefik-redirect-to-https

      # Dashboard: HTTPS
      - traefik.http.routers.traefik-https.rule=Host(`${TRAEFIK_HOSTNAME:?set TRAEFIK_HOSTNAME in .env}`)
      - traefik.http.routers.traefik-https.entrypoints=websecure
      - traefik.http.routers.traefik-https.tls=true
      - traefik.http.routers.traefik-https.tls.certresolver=letsencrypt
      - traefik.http.routers.traefik-https.service=api@internal
      - traefik.http.routers.traefik-https.middlewares=traefik-auth,traefik-gzip

      # Traefik-specific middleware names avoid collisions with application stacks.
      - traefik.http.middlewares.traefik-auth.basicauth.users=${TRAEFIK_BASIC_AUTH:?set TRAEFIK_BASIC_AUTH in .env (htpasswd user:hash)}
      - traefik.http.middlewares.traefik-gzip.compress=true
      - traefik.http.middlewares.traefik-redirect-to-https.redirectscheme.scheme=https
      - traefik.http.middlewares.traefik-redirect-to-https.redirectscheme.permanent=true


volumes:
  traefik_letsencrypt:


networks:
  traefik-public:
    name: traefik-public
    driver: bridge
