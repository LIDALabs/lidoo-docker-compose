[options]
; Minimal stack config for Odoo 18 (Docker Compose).
; Full previous conf kept as config/odoo.old.conf

; Core image addons + host bind ./addons → /mnt/extra_addons
addons_path = /usr/lib/python3/dist-packages/odoo/addons,/mnt/extra_addons

; Sessions, filestore (named volume odoo_data)
data_dir = /var/lib/odoo

; Required behind Traefik / any reverse proxy
proxy_mode = True

; Master password (admin_passwd) is NOT set here.
; Injected at container start from ODOO_ADMIN_PASSWD in .env (see docker-compose.yaml).

; Logging: leave logfile unset → stdout (docker compose logs)
; dev_mode: leave unset (off) for normal operation
