[options]
; Minimal stack config for Odoo 18 (Docker Compose).
; Full previous conf kept as config/odoo.old.conf

addons_path = /usr/lib/python3/dist-packages/odoo/addons,/mnt/extra_addons
data_dir = /var/lib/odoo

; proxy_mode is injected at startup (ODOO_PROXY_MODE): False by default, True in
; the Traefik overlay. Do not set it here — direct access with proxy_mode on
; lets clients spoof X-Forwarded-* headers.

; --- Multiprocessing / async (gevent) ---
; workers is injected at startup (ODOO_WORKERS):
;   - 0 (default, local / no proxy): threaded server; /websocket works on :8069
;   - N >= 1 (Traefik overlay default 2): prefork + gevent on :8072 for
;     /websocket and /longpolling. Required when a reverse proxy routes those
;     paths to 8072. Tune to the host: a common starting point is (2 * CPU) + 1.
; Do not set workers here — the startup script overwrites it from ODOO_WORKERS.
max_cron_threads = 1
limit_time_cpu = 600
limit_time_real = 1200

; Logging: Odoo logs to stdout (captured by `docker logs`). The startup script
; splits that stream so /var/log/odoo/odoo-server.log keeps only ERROR/CRITICAL
; records. Do NOT set `logfile` here or stdout goes silent.
log_level = info

; ---------------------
; Multi-DB by subdomain
; ---------------------
; dbfilter = ^%d$
; list_db = False
